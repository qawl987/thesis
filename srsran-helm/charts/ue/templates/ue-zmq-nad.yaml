apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.multus.nadName }}-{{ .Values.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "capabilities": { "ips": true },
          "master": "{{ .Values.multus.masterIf }}",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "addresses": [{ "address": "{{ .Values.multus.ipAddress }}/{{ .Values.multus.subnetMask }}" }]
          }
        },
        {
          "type": "tuning",
          "capabilities": { "mac": true },
          "ipam": {}
        }
      ]
    }'
